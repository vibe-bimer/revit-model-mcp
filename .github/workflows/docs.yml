name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - mkdocs.yml
      - 'tools/site/**'
      - README.md
      - 'server/revit_model_mcp/**'
      - server/pyproject.toml
      - 'server/README*.md'
      - 'CONTRIBUTING*.md'
      - 'CHANGELOG*.md'
      - 'SECURITY*.md'
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt -e ./server
      - name: Build documentation
        run: |
          python tools/site/generate_features.py --verify-registry --check
          python -m unittest discover -s tools/site -p 'test_*.py'
          mkdocs build --strict
          python tools/site/check_site.py --site-dir site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
