name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - mkdocs.yml
      - mkdocs-lan.yml
      - 'tools/site/**'
      - README.md
      - server/README.md
      - server/README.zh.md
      - server/pyproject.toml
      - 'server/revit_model_mcp/**'
      - CONTRIBUTING.md
      - CONTRIBUTING.zh.md
      - CHANGELOG.md
      - CHANGELOG.zh.md
      - SECURITY.md
      - SECURITY.zh.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: pip install --require-hashes -r docs/requirements.txt
      # The generators read the tool registry from the server package, so the server has to be
      # importable here. --require-hashes cannot be combined with a local editable install, so the
      # server goes in a second command.
      - name: Install the server package
        run: pip install -e ./server
      # Gates run cheapest-first: the line has to exist, then registry drift, then
      # the dual-config build, then the unit suite. The registry check fails fast
      # when a generated page or a translation fingerprint is stale.
      - name: Check the documentation line
        run: python tools/site/check_docs_line.py
      - name: Check the generated registry
        run: python tools/site/generate_features.py --verify-registry --check
      - name: Build both configurations and compare them
        run: python tools/site/verify_dual_build.py
      - name: Run the site test suite
        run: python -m unittest discover -s tools/site -p 'test_*.py'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
