{#-
  The mark is inlined instead of loaded as <img> so it inherits the surrounding colour and stays
  legible on the light header, the dark header and the footer without a second asset or a filter.
  Geometry is the three-tier isometric stack of assets/logo.svg, unchanged.
-#}
<svg class="rmc-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  {% for y in (6, 20, 34) %}
    <g class="rmc-mark__plate">
      <polygon class="rmc-mark__top" points="32,{{ y }} 56,{{ y + 12 }} 32,{{ y + 24 }} 8,{{ y + 12 }}"/>
      <polygon class="rmc-mark__side" points="8,{{ y + 12 }} 32,{{ y + 24 }} 32,{{ y + 29 }} 8,{{ y + 17 }}"/>
      <polygon class="rmc-mark__side" points="32,{{ y + 24 }} 56,{{ y + 12 }} 56,{{ y + 17 }} 32,{{ y + 29 }}"/>
    </g>
  {% endfor %}
</svg>
