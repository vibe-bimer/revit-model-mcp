# Object grouping shared by both catalogs (spec 28, W3).
#
# The generated indexes and the platform navigation browse tools by the model object they
# work on, so a reader looking for sheets or schedules finds them without reading a flat
# list of 22 entries. Membership is data, not code: a tool that appears in neither catalog
# fails the load, and a tool listed twice fails the load.
groups:
  views:
    zh: 视图
    en: Views
    tools:
      - revit_activate_view
      - revit_apply_view_template
      - revit_close_views
      - revit_create_view
      - revit_duplicate_view
      - revit_export_view
      - revit_list_views
      - revit_set_view_lighting
      - revit_set_view_visibility
      - revit_view_elements
      - revit_view_info
      - revit_view_summary
      - revit_view_warnings
  sheets:
    zh: 图纸
    en: Sheets
    tools:
      - revit_create_sheet
      - revit_place_views_on_sheet
  schedules:
    zh: 明细表
    en: Schedules
    tools:
      - revit_create_schedule
      - revit_schedule_data
  view-display:
    zh: 视口与显示
    en: Viewports and display
    tools:
      - revit_capture_elements
      - revit_isolate
      - revit_override_graphics
      - revit_select
      - revit_show
      - revit_tag_elements
