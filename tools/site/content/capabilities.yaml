# 功能文档的内容源：分组、年份状态、一句话说明与提示词。
# 工具名、参数与只读标记来自同目录的 tools.json（由 MCP 服务器导出），这里只写需要人写的内容。
# 参数说明的取值顺序：param_notes（按工具）→ param_defaults（按参数名）→ schema 描述 → docstring 句子 → 类型。

groups:
  connection:
    zh: 连接与文档
    en: Connection and documents
  query:
    zh: 查询与统计
    en: Query and totals
  views:
    zh: 视图与截图
    en: Views and snapshots
  export:
    zh: 导出与检验
    en: Export and checks
  display:
    zh: 选中与显示
    en: Selection and display
  edit:
    zh: 编辑
    en: Editing
  phases:
    zh: 阶段
    en: Phases
  ids:
    zh: 批量与 ID
    en: Batch and ids
  documents:
    zh: 文档与进程
    en: Documents and processes
  batch:
    zh: 批量作业
    en: Batch jobs
  families:
    zh: 族
    en: Families
  sheets:
    zh: 图纸与明细表
    en: Sheets and schedules
  links:
    zh: 链接与协同
    en: Links and coordination
tools:
  revit_ping:
    source: 'f2b515ee3530'
    group: connection
    since: 0.1.0
    title:
      zh: 检查连接
      en: Check connection
    summary:
      zh: 检查连接与插件版本
      en: Check whether the Revit add-in is reachable
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 看看 Revit 插件在不在线
      en: Is the Revit add-in reachable?
  revit_document_info:
    source: '713c86517834'
    group: connection
    since: 0.1.0
    title:
      zh: 文档概要
      en: Document overview
    summary:
      zh: 当前文档概要：文件名、Revit 版本、标高、面积方案、工作集、视图数
      en: Read document metadata, levels, area schemes, worksets and view count
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 当前打开的是哪个模型？有哪些标高？
      en: Which model is open, and which levels does it have?
  revit_model_health:
    source: 'c4a83fabaf1c'
    group: export
    since: 0.2.0
    title:
      zh: 模型检查
      en: Model health
    summary:
      zh: 交付前体检：文件大小、各类计数、单位设置、数量最多的警告
      en: Check file size, model counts, units and frequent warnings
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 做一次交付前体检：文件大小、各类数量、单位设置、最多的警告
      en: 'Run a pre-handover health check: size, counts, units, top warnings'
  revit_links_status:
    source: 'eca81a38c35b'
    group: export
    since: 0.2.0
    title:
      zh: 链接状态
      en: Link status
    summary:
      zh: RVT / CAD / 图片链接的状态、路径与实例数
      en: Inspect RVT, CAD and image link status, paths and instance counts
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 检查所有链接是否正常
      en: 'Check every link: RVT, CAD and images'
  revit_shared_coordinates:
    source: 'f456424f4412'
    group: export
    since: 0.2.0
    title:
      zh: 共享坐标
      en: Shared coordinates
    summary:
      zh: 项目基点、测量点、场地与链接的位移（mm）/旋转（°）
      en: Read base/survey points, sites and link offsets in mm and degrees
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 报告项目的共享坐标和链接位移
      en: Report the shared coordinates and link offsets
  revit_parameter_fill_check:
    source: '8b886aec60ab'
    group: export
    since: 0.2.0
    title:
      zh: 参数填充检查
      en: Parameter fill check
    summary:
      zh: 参数的填充率：有值 / 空 / 缺失，并给出抽样 ID
      en: Count filled, empty and missing parameter values and sample element IDs
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 检查墙的防火等级填充率，给出空值的构件 ID
      en: How well is the fire rating filled in on walls? Give me the empty ids
  revit_list_catalog:
    source: '15200725d19a'
    group: query
    since: 0.1.0
    title:
      zh: 名称目录
      en: Name catalog
    summary:
      zh: 查可用名字：类别、族类型、标高、面积方案、视图、工作集、阶段、参数
      en: Discover categories, family types, levels, area schemes, views, worksets, phases and parameters
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 列出这个模型里所有可用的参数名
      en: List the parameter names this model offers
    note:
      zh: 查询与过滤都用这些名字
      en: Queries and filters use these exact names
  revit_aggregate_elements:
    source: '885dd2bc95b0'
    group: query
    since: 0.1.0
    title:
      zh: 分组统计
      en: Grouped totals
    summary:
      zh: 按 1–2 个字段分组统计数量，可附加求和与平均（mm / m² / m³）
      en: Group by one or two fields, with counts and optional sum and average
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 统计 1F 上各种墙类型各有多少个
      en: How many of each wall type sit on 1F?
    - zh: 按标高统计门的数量和总宽度
      en: Count the doors per level and their total width
    note:
      zh: 回答“有多少”的首选，比逐条取明细快得多
      en: First choice for “how many” questions
  revit_query_elements:
    source: 'f19f48418eec'
    group: query
    since: 0.1.0
    title:
      zh: 构件查询
      en: Element query
    summary:
      zh: 按类别/族/类型/标高/视图/工作集/参数过滤，分页读取构件明细
      en: Filter and page through individual element rows
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 列出 2F 上所有没填防火等级的门，给出 ID
      en: List the doors on 2F whose fire rating is empty, with ids
  revit_list_views:
    source: 'e8880f91d3fa'
    group: views
    since: 0.1.0
    title:
      zh: 视图目录
      en: View catalog
    summary:
      zh: 列出视图，可按视图类型与名称过滤
      en: List views filtered by type and name
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 列出所有平面视图
      en: List every floor plan view
  revit_view_summary:
    source: 'c891d7099c57'
    group: views
    since: 0.1.0
    title:
      zh: 视图统计
      en: View summary
    summary:
      zh: 视图元数据 + 类别计数（各有多少、多少种类型）
      en: Read view metadata, category counts and number of distinct types
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 三维视图里各类构件分别有多少个？
      en: What does the 3D view hold, category by category?
  revit_export_view:
    source: 'a1163a0c0d32'
    group: views
    since: 0.3.0
    title:
      zh: 导出视图图片
      en: Export view image
    summary:
      zh: 把视图导出成 PNG 图片（1–4000 像素）
      en: Export a view as a PNG, from 1 to 4000 pixels
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 把 1F 平面导出成 PNG，宽度 2000 像素
      en: Export the 1F plan as a PNG, 2000 pixels wide
  revit_export_element_ids:
    source: 'c091f63079d0'
    group: export
    origin: fork
    since: 0.8.0
    title:
      zh: 导出构件 ID 清单
      en: Export element ID register
    summary:
      zh: 把模型中已绘制构件的 ID 清单写成 Excel（类别/族/类型/标高/构件ID/名称/工作集）
      en: Write the ID register of drawn model components to an Excel workbook
    years:
      '2020':
        state: validated
      '2026':
        state: built
      other:
        state: built
    prompts:
    - zh: 把模型中已绘制构件的 ID 清单导出成 Excel，按类别、族、类型排序
      en: Export the ID register of drawn model components to Excel, ordered by category, family and type
    note:
      zh: 文件写到 Revit 工作站上
      en: The workbook is written on the Revit workstation. The column headers are Chinese Revit UI labels — 类别, 族, 类型, 标高, 构件ID, 名称 and 工作集 are category, family, type, level, element id, name and workset.
  revit_view_elements:
    source: '3176007180eb'
    group: views
    since: 0.2.0
    title:
      zh: 视图构件明细
      en: View element rows
    summary:
      zh: 分页读取视图中的构件（可按类别过滤）
      en: Page through elements in a selected view, optionally filtered by category
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 把三维视图里的构件列表给我，每页 200 条
      en: Page through the elements of the 3D view, 200 at a time
  revit_element_details:
    source: 'c0bf00b0f814'
    group: query
    since: 0.1.0
    title:
      zh: 构件参数与几何
      en: Element details
    summary:
      zh: 单个构件的实例参数、类型参数与几何（mm）
      en: Read instance/type parameters and geometry for one element ID
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 把 ID 357640 的构件参数和几何都读出来
      en: Show every parameter and the geometry of element 357640
    note:
      zh: 房间还会返回面积、体积与边界
      en: Rooms also return area, volume and boundaries
  revit_view_warnings:
    source: 'e836252b7fa0'
    group: views
    since: 0.4.0
    title:
      zh: 视图相关警告
      en: View warnings
    summary:
      zh: 只读该视图相关构件的警告
      en: Read warnings involving elements present in a selected view
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 这个视图里有哪些警告？
      en: Which warnings touch this view?
  revit_list_warnings:
    source: '5f071324cbc3'
    group: export
    since: 0.4.0
    title:
      zh: 模型警告
      en: Model warnings
    summary:
      zh: 全模型警告按文本分组，可展开受影响构件
      en: Group model warnings by description and inspect affected elements
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 列出数量最多的警告
      en: Group the model warnings by text
  revit_list_relations:
    source: 'a5978b8d2ced'
    group: query
    since: 0.7.0
    title:
      zh: 构件关系
      en: Element relations
    summary:
      zh: 关系查询：标高的房间、面积方案成员、组内构件、嵌套族、视图样板依赖
      en: Read level rooms, area-scheme membership, group members, nested families and view-template dependents
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 1F 标高上都有哪些房间？
      en: Which rooms sit on level 1F?
  revit_list_instances:
    source: '7a9dcbcbbbb3'
    group: connection
    since: 0.6.0
    title:
      zh: Revit 实例列表
      en: Revit instance list
    summary:
      zh: 列出在跑的 Revit 实例及其打开的文档
      en: List running Revit instances and their active documents
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 现在有几个 Revit 实例？各自打开什么模型？
      en: Which Revit instances are running, and what does each hold?
  revit_select:
    source: '43cb337219da'
    group: display
    since: 0.1.0
    title:
      zh: 选择构件
      en: Select elements
    summary:
      zh: 在 Revit 里选中指定构件（空列表=清除选择）
      en: Select elements in Revit; an empty list clears the selection
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 选中 ID 为 123456 的构件
      en: Select element 123456
    note:
      zh: 不改模型
      en: Does not change the model
  revit_show:
    source: 'c71c807d5db8'
    group: display
    since: 0.2.0
    title:
      zh: 定位显示构件
      en: Show elements
    summary:
      zh: 在视图里定位/高亮构件，必要时打开对应视图
      en: Locate and highlight elements, opening a suitable view when needed
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 把这几根柱子显示给我看
      en: Show me those columns in the view
    note:
      zh: 不改模型
      en: Does not change the model
  revit_isolate:
    source: 'f271939e4d03'
    group: display
    since: 0.2.0
    title:
      zh: 临时隔离显示
      en: Temporary isolation
    summary:
      zh: 临时隔离显示（reset=true 恢复）
      en: Temporarily isolate selected elements or reset the active view
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 只显示这一层的窗
      en: Isolate the windows of this level
    note:
      zh: 临时效果，不写模型
      en: Temporary effect only
  revit_move:
    source: '9db2e14d4115'
    group: edit
    since: 0.1.0
    title:
      zh: 移动构件
      en: Move elements
    summary:
      zh: 按模型轴平移构件（mm）
      en: Move elements by offsets along model axes in millimetres
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 把这 3 个构件沿 X 移动 500 mm，先彩排
      en: Move these three elements 500 mm along X, dry run first
    note:
      zh: 支持 dry_run
      en: Supports dry_run
  revit_place_family:
    source: 'd7d1e53536ca'
    group: edit
    since: 0.2.0
    title:
      zh: 放置非宿主族
      en: Place unhosted family
    summary:
      zh: 在指定标高放置已载入的非宿主族实例，可绕 Z 旋转
      en: Place a loaded unhosted family on a named level with optional Z rotation
    years:
      '2020':
        state: validated
      '2026':
        state: built
      other:
        state: built
    prompts:
    - zh: 用已载入的非宿主家具族，在 1F 的 (3000, 4000) 放置一个实例，先彩排
      en: Place an instance of a loaded unhosted furniture family at 3000,4000 on 1F, dry run first
    note:
      zh: 2026 未真机验证
      en: Not run live on 2026
  revit_create_wall:
    source: '768409437256'
    group: edit
    since: 0.2.0
    title:
      zh: 创建直墙
      en: Create straight wall
    summary:
      zh: 按两点建直墙（mm，指定标高、墙类型、高度）
      en: Create a wall from two XY points, a level, type and height
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 在 1F 从 (0,0) 到 (6000,0) 建一道 200mm 墙
      en: Draw a 200 mm wall on 1F from 0,0 to 6000,0
  revit_create_floor:
    source: '05d38c39dfbb'
    group: edit
    origin: fork
    since: 0.2.0
    title:
      zh: 创建楼板
      en: Create floor
    summary:
      zh: 按闭合轮廓建楼板（至少 3 个顶点，mm）
      en: Create a floor from a closed XY boundary with at least three vertices
    years:
      '2020':
        state: validated
      '2026':
        state: built
      other:
        state: built
    prompts:
    - zh: 用这四个点在 2F 建一块楼板
      en: Create a floor on 2F from these four points
    note:
      zh: 2020 走 Document.Create.NewFloor，2022+ 走 Floor.Create
      en: On 2020 it uses Document.Create.NewFloor, from 2022 Floor.Create
  revit_create_level:
    source: '68d2a6d6c941'
    group: edit
    origin: fork
    since: 0.10.0
    title:
      zh: 创建标高
      en: Create level
    summary:
      zh: 在指定高程新建标高（mm）
      en: Create a level at a given elevation in millimetres
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 在 15000mm 处建一个叫 4F 的标高
      en: Create a level named 4F at 15000 mm
    note:
      zh: 同名标高会被拒绝，避免后续工具解析到有歧义的标高
      en: An existing level with the same name is refused, so a later tool never resolves an ambiguous level
  revit_set_phase:
    source: 'e6065da74fe8'
    group: phases
    origin: fork
    since: 0.3.0
    title:
      zh: 设置构件阶段
      en: Set element phases
    summary:
      zh: 赋创建阶段 / 拆除阶段（空串清除，null 不变）
      en: Assign created/demolished phases; an empty string clears and null leaves unchanged
    years:
      '2020':
        state: validated
      '2026':
        state: built
      other:
        state: built
    prompts:
    - zh: 把这些构件标成在“现有”阶段拆除
      en: Mark these elements as demolished in the Existing phase
    note:
      zh: 阶段顺序检查的 API 只在 2022+ ，2020 走兜底
      en: The phase order API exists from 2022; 2020 uses a fallback. Phase names are Revit UI strings, so in the example demolished_phase="现有" the value is the Chinese label of the Existing phase.
  revit_merge_phases:
    source: '814d4b6f194d'
    group: phases
    origin: fork
    since: 0.3.0
    title:
      zh: 合并项目阶段
      en: Merge project phases
    summary:
      zh: 把一个阶段的引用并入另一个阶段并删除空阶段
      en: Reassign references to another phase and attempt to delete the emptied phase
    years:
      '2020':
        state: validated
      '2026':
        state: built
      other:
        state: built
    prompts:
    - zh: 把“阶段 1”合并进“新构造”
      en: Merge phase 1 into New Construction
    note:
      zh: 不可放进 batch
      en: Cannot run inside batch
  revit_set_parameter:
    source: '4573f9a8a6c9'
    group: edit
    since: 0.1.0
    title:
      zh: 修改参数
      en: Edit parameter
    summary:
      zh: 按参数名写值（长度 mm、面积 m²，其余按内部单位）
      en: Set a named parameter; lengths use mm, areas m² and other doubles internal units
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 把这些墙的防火等级改成 2 小时
      en: Set the fire rating of these walls to two hours
    note:
      zh: 支持 dry_run
      en: Supports dry_run
  revit_delete:
    source: '6ec510a16f9b'
    group: edit
    since: 0.1.0
    title:
      zh: 删除构件
      en: Delete elements
    summary:
      zh: 删除构件及其依赖
      en: Delete selected elements and their Revit dependencies
    years:
      '2020':
        state: validated
      '2026':
        state: validated
      other:
        state: built
    prompts:
    - zh: 删掉这两个构件，先彩排
      en: Delete these two elements, dry run first
    note:
      zh: 支持 dry_run
      en: Supports dry_run
  revit_reset_element_ids:
    source: '43f1cb6a7669'
    group: ids
    origin: fork
    since: 0.8.0
    title:
      zh: 同文档替换 ID
      en: Replace IDs in place
    summary:
      zh: 同文档内换 ID：只对无宿主、无依赖的独立构件有效
      en: Replace eligible standalone elements with copies to obtain new IDs
    years:
      '2020':
        state: validated
      '2026':
        state: built
      other:
        state: built
    prompts:
    - zh: 给选中的这 27 个独立构件换新 ID
      en: Give these 27 standalone components new ids
    note:
      zh: 先运行 dry_run；有宿主、有依赖、成组或属于 MEP 系统的构件会被拒绝
      en: Run dry_run first; hosted, dependent, grouped and MEP-system elements are refused
  revit_rebuild_model_ids:
    source: '65e009899f59'
    group: ids
    origin: fork
    since: 0.8.0
    title:
