# Upstream pages that arrive as English prose (ADR-0007). They ship in the default
# tree unchanged until a zh translation exists; the language audits exempt exactly
# these paths and still fail on any undeclared English page.
inherited_pages:
  - admin/deployment.md
  - admin/policy-reference.md
  - admin/security-questionnaire.md
  - admin/security-whitepaper.md
  - batch.md
  - code-signing.md
  - design/model-audit.md
  - install.md
  - mcp-specifications.md
  - not-doing.md
  - prompts.md
  - stability.md
  - tested-clients.md
  - tool-manifest.md
  - updates.md

# Declarative catalog manifest for the documentation site.
#
# Two catalogs are published side by side and must never be confused:
#   release      the released tool surface under docs/features, built from tools.json.
#   integration  the tool surface of the integration branch under docs/platform, built from
#                platform-tools.json. It is unreleased.
#
# The generators and the site checker read this file instead of hard-coding a version string,
# a branch name, a tool count or a tool name. The release version is read from project
# metadata, so it moves with the package instead of being copied here.
#
# page_languages overrides the catalog default for one page stem when a page is intentionally
# monolingual (for example an inherited page kept in English only). A page that promises a
# language it does not ship makes generation and validation fail.
release:
  directory: features
  status: released
  branch: main
  languages: [zh, en]
  page_languages: {}
  version:
    file: server/pyproject.toml
    format: toml
    pointer: project.version
  # The last version that was actually published. A tool whose `since` is at or
  # below this ships in a release; a newer one exists only in the tree, so its
  # page says unreleased instead of claiming a release that has not happened.
  released_version: 0.9.0

integration:
  directory: platform
  status: unreleased
  branch: integration/upstream-1.0
  languages: [zh, en]
  page_languages: {}
  provenance:
    file: tools/site/content/platform-tools.json

# Fork-owned tools: the ones this repository designed, not the upstream base. Only grafted
# tools exist on the branch yet; pending ones are tracked on the fork-tools page.
fork_tools:
  revit_set_view_lighting:
    status: grafted
    zh: 设置视图光照
    en: Set view lighting
    zh_note: 已通过 fork 注册表接上七个兜底钩子，Python 工具注册与单元测试通过；C# 编译与真机验证仍在 Windows CI 与工作站上。
    en_note: Attached through the fork registry and the seven fallback hooks; the Python tool and its unit tests pass. C# compilation and live validation still happen on Windows CI and the workstation.
  revit_create_level:
    status: pending
    zh: 创建标高
    en: Create level
    zh_note: 已有本地实现（含 dry_run 与验证块），待按新契约重映射到 fork 注册表。
    en_note: The local implementation exists with dry_run and a verification block; it still has to be remapped onto the fork registry.
  revit_create_floor:
    status: pending
    zh: 创建楼板
    en: Create floor
    zh_note: 已有本地实现，待重映射。
    en_note: The local implementation exists; it still has to be remapped.
  revit_set_phase:
    status: pending
    zh: 设置阶段
    en: Set phase
    zh_note: 已有本地实现；Revit 阶段不能创建或改名，只能写入既有阶段。
    en_note: The local implementation exists; Revit cannot create or rename phases, so it only assigns existing ones.
  revit_merge_phases:
    status: pending
    zh: 合并阶段
    en: Merge phases
    zh_note: 已有本地实现；该命令不进批量步骤词表。
    en_note: The local implementation exists; the command is excluded from the batch step vocabulary.
  revit_export_element_ids:
    status: pending
    zh: 导出构件 ID 台账
    en: Export element ID register
    zh_note: 已有本地实现，输出 xlsx 台账，含系统成员与连接器读取。
    en_note: The local implementation writes an xlsx register and reads system members and connectors.
  revit_reset_element_ids:
    status: pending
    zh: 重置构件 ID
    en: Reset element IDs
    zh_note: 已有本地实现，可排练（dry_run 报出代价），每构件独立子事务。
    en_note: The local implementation is rehearsable, reports the cost in dry_run, and commits each element in its own subtransaction.
  revit_rebuild_model_ids:
    status: pending
    zh: 重建模型 ID
    en: Rebuild model IDs
    zh_note: 已有本地实现（约一千行），支持模板、副本与重名策略；是最后一个移植项，工作量约等于前五项之和。
    en_note: The local implementation is about a thousand lines and supports templates, copies and duplicate-name policies; it is the last item to migrate and roughly equals the first five together.
