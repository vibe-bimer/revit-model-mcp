# Chinese translations of the complete English tool descriptions in tools.json.
# English is authoritative. source is SHA-256 of the exact description UTF-8 bytes.
# Parameter schemas are documented separately and are not translated here.
tools:
  revit_ping:
    zh: '检查 RevitModelMcp 连接，不读取模型。


      返回 `data="pong"` 的响应，即使没有活动文档也会返回。

      连接失败或超时会报错；不返回部分结果。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: f2b515ee353029ff76fc496cb4a20450e7c7bdf9fc52fc09cd143f63c8dc29b6
  revit_document_info:
    zh: '读取活动 Revit 模型的基本信息。


      返回的数据包含文件名、Revit 版本、标高（高程单位为 mm）、面积方案、工作集和视图数量。

      不存在的集合为空；未启用工作共享的模型没有工作集。

      要分析视图，下一步调用 `revit_list_views`。

      没有活动文档、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 713c865178341f26f76010460dae81ea721d18aaf609c15a6171a4fbff7de333
  revit_model_health:
    zh: '在导出或交付前读取模型质量统计。


      返回的数据包含项目元数据、文件大小（单位为字节）、数量统计、单位设置，以及出现次数最多的 10 组警告。

      不存在的对象计数为 0；无法获取的指标为 `null`，并与对应错误一起列在 `skipped` 中。

      使用 `revit_list_warnings` 查看受影响的构件。

      没有活动文档、整体读取失败或超时都会报错；超时不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c4a83fabaf1c3d2e7f7345ec2c264ccd252ef7a9e4551596d8b7a2d0a836d856
  revit_links_status:
    zh: '在导出或交付前读取 RVT、CAD 和图像链接的状态。


      返回的数据包含汇总计数，以及 `rvtLinks`、`cadLinks` 和 `images` 列表；列表条目包含状态、路径和实例数量。

      每个列表按 ID 最多返回 100 个条目，不支持分页；汇总计数覆盖全部条目。

      没有链接时返回空列表；单个条目的失败会记录在 `error` 中，状态为 `Other`。

      没有活动文档、整体读取失败或超时都会报错；超时不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: eca81a38c35b7443c3d147722fb335a6540abd761974362ed8daf17f396aee01
  revit_shared_coordinates:
    zh: '在导出或交付前读取项目坐标和测量坐标。


      返回的数据包含项目基点／测量点、活动场地、项目位置，以及链接的偏移量和旋转角；偏移量单位为 mm，旋转角单位为度，均四舍五入到小数点后 1 位。

      位置和链接列表各最多返回 100 个条目，不支持分页，同时提供总数；没有链接时 `sharedSiteFromLinks` 为空列表。

      没有活动文档、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: f456424f44125825b27faa4f6b262c1e0b15be90b189bea71e43b85296a298ae
  revit_parameter_fill_check:
    zh: '在导出或交付前统计参数的已填写、空值和缺失情况。


      返回的数据包含检查范围、按参数和类别划分的数量统计、参数属于实例还是类型的信息、存储类型，以及空值／缺失参数的构件 ID 样本。

      没有匹配构件时，计数为 0，样本为空；不存在的参数计为缺失，数值 0 计为已填写。

      文档不存在、检查范围无效或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 8b886aec60ab9e1347d8e7ba8639adf705ec26158488d31ad6b80d9d34addc41
  revit_list_catalog:
    zh: '在设置筛选条件前，查找模型中可用的名称。


      返回的数据包含 `section` 和 `items`；条目包含名称，以及该分区对应的 ID、类别、类型或数量；目录为空时返回 `items=[]`。

      `section` 为必填项，可取 `categories`、`family-types`、`levels`、`area-schemes`、`views`、`worksets`、`phases` 或 `parameters`。

      `parameters` 分区返回本地化参数名、类别和值类型。

      通用模型查询应从本工具开始；计数和分类汇总优先使用 `revit_aggregate_elements`，仅在需要单个构件的数据行时使用 `revit_query_elements`。

      分区未知、文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 15200725d19a779e9002612bec9c7395b0a32d10c342327b1bb351fd94f41336
  revit_aggregate_elements:
    zh: '在调用 `revit_list_catalog` 后，按 1 个或 2 个字段汇总匹配的构件。


      返回的数据包含 `matchedElements` 和 `groups`；每组包含分组键、`count`，以及可选的 `numericCount`、`sum`、`average` 和 `unit`。

      长度使用 mm，面积使用 m2，体积使用 m3；没有数值的分组，其 `sum` 和 `average` 为 `null`。

      没有匹配项时返回 `groups=[]`；即使结果为空，无效的字段名或筛选条件名也会报错。

      先调用 `revit_list_catalog`；计数和分类汇总优先使用本工具，仅在需要单个构件的数据行时使用 `revit_query_elements`。

      汇总面积时，按标高分组，并选择面积方案。

      文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 885dd2bc95b056fa4875a749c46a444d79e49c98cd7fe899b3e04de68e290b54
  revit_query_elements:
    zh: '在调用 `revit_list_catalog` 后，读取一页匹配构件的数据行。


      返回的数据包含 `elements`（`id` 和 `values`）、`fields`、`total`、`offset`、`limit` 和 `hasMore`；值会包含可用性、来源，以及可获取时的单位。

      长度使用 mm，面积使用 m2，体积使用 m3；可选的几何数据使用模型坐标系中的 mm，四舍五入到小数点后 1 位；无法获取的几何数据会省略。

      在房间内放置对象时使用 `roomCenterMm`；包围盒中心可能位于房间外。

      没有匹配项，或偏移量超出结果范围时，返回 `elements=[]`；当 `hasMore=true` 时，增加 `offset` 继续读取。

      先调用 `revit_list_catalog`；计数和分类汇总优先使用 `revit_aggregate_elements`。

      字段或筛选条件无效、文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: f19f48418eec007676d951666c3fe877bbbaa0616c0d6fe724332f164214ac7e
  revit_list_views:
    zh: '在分析视图前查找非模板视图。


      返回的数据包含 `views`；每个视图包含 `id`、`name`、`type`、`level`、`scale` 和 `template`，并提供已扫描非模板视图的 `total` 和 `processed` 计数。

      没有视图匹配筛选条件时返回 `views=[]`。

      在请求构件分页数据前，将返回的视图名称传给 `revit_view_summary`。

      文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: e8880f91d3fac5b477e120f1da7604ec7e77ee86d0b791abb780f7cee7d914e8
  revit_view_summary:
    zh: '读取指定视图中的构件类别及数量。


      返回的数据包含视图头部元数据和 `categories`；每个类别包含 `count` 和 `differentTypes`；空视图返回 `categories=[]`。

      视图计数优先使用本工具；先选择相关类别，再调用 `revit_view_elements` 读取单个构件的数据行。

      文档不存在、视图未知或不受支持、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c891d7099c576d1ada4bab2d2870c90d7cc81b7e243ca59b5bb45ee235bce9b6
  revit_export_view:
    zh: '当数字无法解释几何形状时，将指定视图导出为 PNG。


      返回的数据包含 MCP 客户端上的 `localPath`、图像宽度／高度（单位为像素）、`sizeBytes` 和视图元数据，不包含 base64。

      导出不会改变活动视图，也不会写入模型；可用于检查轮廓、区域和房间边界。

      文档不存在、视图未知或不受支持、目标文件已存在、未生成 PNG 或下载失败都会报错。

      使用默认的 120 秒响应等待预算和 300 秒任务拾取等待预算；超时会报错，不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: a1163a0c0d32c9faba244cd2b19544afab571f7f8753d996c72718f9cd654d8a
  revit_export_element_ids:
    zh: '将已绘制构件的标识清单写入 Revit 工作站上的 xlsx 文件。


      返回的数据包含 `path`、`fileName`、`sheetName`、`columns`、`rowCount`、`totalCandidates`、`truncated`、`sizeBytes` 和 `categoryCounts`。

      数据行先按类别、再按族、最后按类型排序；默认列为“类别、族、类型、标高、构件ID、名称、工作集”，`fields` 可将这些列替换为内置字段或参数名称。

      “构件ID”列记录 Revit 构件 ID，API 无法为构件指定这个 ID；本工具只列出标识，绝不会修改它们。

      没有所属标高的构件，其标高列保持为空；大多数 MEP 管道和风管管段属于这种情况。

      默认 `null` 会在工作站上写入 `Documents\RevitModelMcp\Exports\构件ID清单_<model>_<timestamp>.xlsx`；如果 `path` 指定的文件已存在则报错；超过 50,000 行时设置 `truncated=true`。

      导出仅在模型外写入一个文件，绝不会写入模型；文档不存在、读取失败或超时都会报错。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c091f63079d079d4170c5ec19e8f93f968f0839189a3c6e8f6a45c7ce7972d90
  revit_view_elements:
    zh: '读取指定视图中的一页构件数据。


      返回的数据包含 `elements`、`total`、`offset`、`limit` 和 `hasMore`；每行包含 ID、类别、族、类型、标高，以及可获取的测量值，单位为 mm、m2 和 m3。

      没有匹配项，或偏移量超出结果范围时，返回 `elements=[]`；当 `hasMore=true` 时，增加 `offset` 继续读取。

      计数和查找类别优先使用 `revit_view_summary`；使用本工具读取单个构件的数据行，使用 `revit_element_details` 读取全部参数。

      文档不存在、视图未知或不受支持、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 3176007180eb53f5759887c4cb5b36618ebcc32467ba768774d7287a3cc47766
  revit_element_details:
    zh: '按 Revit ID 读取构件的参数和几何数据。


      返回的数据包含 `element`、实例参数、可获取的 `typeElement` 参数，以及相关警告；没有警告时返回空列表。

      房间数据包含标高、面积（m2）、体积（m3）和边界（mm）；参数值包含显示值／内部值，以及可获取时的公制单位。

      `location` 和 `boundingBox` 使用模型坐标系中的 mm，四舍五入到小数点后 1 位；无法获取的几何数据会省略。

      在房间内放置对象时使用 `roomCenterMm`；`boundingBox.centerMm` 可能位于非矩形房间外。

      构件或文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c0bf00b0f814cfc1a51e532f5f5a178fb789b5eb3821c6c181d15461bb07eb74
  revit_view_warnings:
    zh: '读取涉及指定视图中构件的警告。


      返回的数据包含 `view` 和 `warnings`；每条警告包含文本、严重程度，以及带 `presentOnView` 标记的构件 ID；没有相关警告时返回 `warnings=[]`。

      一条警告也可能同时涉及视图外的构件。

      使用 `revit_view_summary` 检查视图内容，或使用 `revit_list_warnings` 查看整个模型的警告分组。

      文档不存在、视图未知或不受支持、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: e836252b7fa03fc8dd194498c8ff6856f07542b908d4311489a53a5b6a25bb00
  revit_list_warnings:
    zh: '按警告描述文本对模型警告分组。


      返回的数据包含 `totalWarnings` 和 `groups`；每组包含 `text`、`severity`、`count`、`affectedElementCount`，以及可选的构件数据行。

      首次调用不设置筛选条件，再使用返回的 `warning_text` 并设置 `include_elements=true`，重新调用以查看某个分组。

      模型没有警告时返回 `groups=[]`；`warning_text` 没有匹配项时会报错。

      文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 5f071324cbc38420ecc64f6d925b8e80f53c7d63e655084afd11859f844bc8cf
  revit_list_relations:
    zh: '读取模型对象的成员关系或依赖关系。


      返回的数据包含 `relation`、`source` 和 `elements`；构件条目包含 ID、名称、类别、族和类型；没有相关对象时返回 `elements=[]`。

      `relation` 为必填项：`level-rooms`、`area-scheme-elements` 或 `view-template-dependents` 需配合 `source_name`；`group-elements` 或 `nested-family` 需配合 `source_id`。

      从 `revit_list_catalog` 获取来源对象名称，从构件查询结果获取 ID。

      关系无效、来源对象缺失或错误、文档不存在、读取失败或超时都会报错；不返回部分数据。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: a5978b8d2ceda8edd6824dd9085ce729e58182263fcaa97aa2108ec66edb5a61
  revit_list_instances:
    zh: '列出 Revit 进程及其活动文档。


      返回一个记录列表，每条记录包含 `documentName`、`documentPath`、`revitVersion`、`pluginVersion`、`processId` 和 `pluginResponding`；没有匹配实例时返回 `[]`。

      `pluginVersion` 标识加载项的构建版本，例如 `0.6.0+68febc5d`；由旧版加载项写入的心跳中，此字段为空。

      本地和 SSH 模式使用加载项心跳，并在需要时回退到进程检测；回退记录中的文档为空，且 `pluginResponding=false`。

      HTTP 模式只报告其连接的进程；传输失败会报错。

      在为其他工具选择唯一的文档子串前，先使用本工具。

      '
    source: 7a9dcbcbbbb37f6dfa6032d5a137f95c36d407a003f02ab979dfb3eed2131e66
  revit_select:
    zh: '按构件 ID 在 Revit 中选择构件以供检查；空列表会清除选择；ID 没有单位。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 43cb337219da6c4e09548ed7d99a3aca115b0363f82f388cd66c4cddcaf1a00e
  revit_show:
    zh: '显示构件，并可选择是否选中它们；需要时打开标高平面视图或三维视图。返回 `activeView`、`viewOpened` 和 `dialogsSuppressed`；ID 没有单位。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: c71c807d5db8abc2a203a559f3fbde046d0b4ac02f1a88fe1f6a70d1180bcd20
  revit_isolate:
    zh: '在活动视图中按 ID 临时隔离构件以供目视检查，或传入空列表来重置隔离；ID 没有单位。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: f271939e4d03adc091f869b029d05a3d765f6ed73534172ed03c617227edebb3
  revit_move:
    zh: '通过移动构件调整其位置；`dx_mm`、`dy_mm` 和 `dz_mm` 是沿模型坐标轴的偏移量，单位为毫米。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 9db2e14d4115a985e016f99cdb9bcabe5799dca8c2e9da024190bb2139436590
  revit_place_family:
    zh: '在指定标高上放置已加载、无需宿主的族，用于布局。


      `family` 接受族名称或 `Family: Type` 格式，不区分大小写。

      `type_name` 为 `null` 时，使用 `family` 中指定的类型，或第一个类型。类型指定冲突时会拒绝操作。

      族不存在时，返回名称相近的族及其类别。

      模型 XY 坐标单位为毫米，绕 Z 轴的旋转角单位为度。

      在房间内放置对象时使用 `roomCenterMm`。


      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: d7d1e53536ca2c85a7f6be9bb869918679ff9e15f90da139c624b410d0346580
  revit_create_wall:
    zh: '在指定标高上创建直墙，用于布局；模型 XY 端点坐标和高度的单位为毫米；`wall_type` 为 `null` 时选择第一个基本墙类型。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 768409437256ada522f11fb0dd7e8d5a8af3c74ffb33a544dd697d602f9339f9
  revit_create_floor:
    zh: '根据闭合边界，在指定标高上创建楼板，用于布局。

      `points_mm` 是模型 XY 坐标系中的多边形顶点，单位为毫米（至少 3 个顶点；边界会自动闭合）；`floor_type` 为 `null` 时选择第一个楼板类型。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 05d38c39dfbb26c424e07f27d4fa1ab496ec533abf505f3d0b87a7ff7629e703
  revit_create_level:
    zh: '在指定高程新建标高，用于布局。

      `name` 是标高名称；已存在同名标高时会被拒绝，这样后续工具永远不会解析到有歧义的标高。`elevation_mm` 是相对项目基点的毫米高程。

      `create_view` 为真时同时创建对应的楼层平面视图；视图类型按视图族选择，不按名称。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 68d2a6d6c9415f35b5d469f02f5818b802728250933f3a7cb181abc277b8d899
  revit_set_phase:
    zh: '按准确的阶段名称，指定构件的创建阶段或拆除阶段。


      每个阶段参数可以是 `revit_list_catalog(section="phases")` 返回的阶段名称，也可以是用于清除该指定的空字符串，或用于保持不变的 `null`；至少一个参数必须非 `null`。

      创建操作的 API 无法新增阶段；请先在 Revit 界面中创建新阶段。

      例如，`demolished_phase="现有"` 将构件标记为在该阶段拆除；`demolished_phase=""` 则清除拆除阶段。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: e6065da74fe8dcd85c40450e65aa18a63c050369a496081cac309baaf0977756
  revit_merge_phases:
    zh: '将一个项目阶段合并到另一个阶段，迁移所有构件的阶段引用。


      在源阶段创建的构件会重新指定到目标阶段，记录在源阶段的拆除也会迁移到目标阶段，然后删除已清空的源阶段。

      如果视图或其他对象仍然引用源阶段，Revit 可能拒绝删除它；此时响应会报告已重新指定的数量，并返回 `sourceDeleted:false`。

      本工具绝不会创建阶段或重命名阶段。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 814d4b6f194d7c8d9f2e090a5caf0c3466ef123a8a9a5f3ea3946dbd688d9b5e
  revit_set_parameter:
    zh: '设置指定名称的实例参数；找不到时回退到该实例共用的类型上的参数。用于编辑时，长度单位为 mm，面积单位为 m2，其他双精度数值使用内部单位。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 4573f9a8a6c9495660e4f7ab64dc41b0bc36981c7b1b2b971bd4a99bb96a8fce
  revit_delete:
    zh: '需要移除时，删除构件及其 Revit 依赖对象；ID 没有单位，返回的删除数量包含依赖对象。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 6ec510a16f9b18c96a16995865dda7c7e345baa1989ad3af6eebef1d6018cf6e
  revit_reset_element_ids:
    zh: '用副本替换构件，让 Revit 分配新的构件 ID；API 本身无法指定构件 ID。


      返回的数据包含 `count`、`idMapping`（旧 ID 到新 ID 的映射），以及 `ineligible` 中列出的不符合条件构件和各自的原因。

      以下情况会拒绝构件：删除它也会删除依赖对象；它依附于宿主（副本不会重新关联宿主）；它属于组；它是 MEP 曲线或 MEP 系统成员（副本不会重新加入网络，且 Revit 会重新修复管线）；或 Revit 报告该构件无法复制。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块；务必先执行试运行，因为这种替换无法撤销。

      正式执行时，只要有任何构件不符合条件，就会拒绝整个选择范围，以防依赖构件被意外销毁。

      本工具绝不会就地修改构件 ID，也绝不会将旧 ID 写入参数。

      '
    source: 43f1cb6a7669f69047a9b060719ff61cf2eb939756501ad6a2d52e5ff7379185
  revit_rebuild_model_ids:
    zh: '将三维视图中可选择的构件复制到新模型，为每个构件生成新 ID，因为 Revit 不允许指定构件 ID。


      绝不会修改已打开的模型：结果写入工作站上的 `destination_path`，源模型保持原样。

      `view` 指定要读取的三维视图；不提供时使用第一个非透视三维视图，而且只复制该视图中可选择的构件。

      标高、轴网和参照平面会一起复制，以便解析宿主关系；相机、太阳路径、剖面框、视图以及没有类别的构件不会复制，并会在 `excluded` 中报告。

      视图、图纸、明细表、注释、阶段、工作集、MEP 系统以及未被选中的宿主都不会复制，因此结果只包含几何形状、类型和参数。

      返回的数据包含 `destinationPath`、`saved`、`count`、`sourceView`、`sourceElementCount`、`datumCount`、`sourceCategoryCounts`、`copiedCategoryCounts`、`newIdMin`／`newIdMax`、`idMapping`（旧 ID 到新 ID 的映射，已按类别和类型验证），以及 `excluded` 中列出的被排除构件和各自的原因。

      `overwrite` 用于替换已有文件；`template_path` 用于从指定模板开始复制，而不是使用默认公制模板；`remove_template_levels` 用于移除模板自身的标高。

      `seed` 会在复制前向新模型添加相应数量的临时标高，再将它们移除，以使新 ID 位于独立的编号区段；否则，对相同源模型重建两次会产生相同 ID。因此，当需要各副本的 ID 互不重叠时，应为每次复制传入不同的 `seed`（例如 0、1000、2000）。

      `duplicate_names` 决定新项目中已有与粘贴来源同名对象时如何处理：`override` 会以“确定”回答 Revit 的提示，使副本保留源模型自身的类型；`rename` 会先重命名模板中的对象，随后再移除它们，但速度较慢，并且在 Revit 拒绝删除某些对象时可能失败。

      `copies` 指定从同一个新模型写出的文件数量：各副本包含相同构件，但各有自己的 ID，因为每个副本的 ID 都从前一个副本的 ID 区段之后开始。文件写入 `destination_path`，其中的 `{n}` 会替换为副本编号；路径不含 `{n}` 时，则在扩展名前追加编号。每个副本的映射会在 `copyResults` 中报告，各副本每个阶段的耗时会写入插件日志。

      `dry_run` 会执行复制并报告映射，但不保存文件。

      '
    source: 65e009899f5970312086263aaea679ef9aa93d41a460c96ece88c863bbe66f59
  revit_set_view_lighting:
    zh: '设置一个视图的光照：阴影、太阳位置、地面平面、背景以及渲染光源方案。


      `view` 是准确的非样板视图名称，或 `revit_list_views` 报告的十进制视图 ID；没有太阳与阴影设置的视图会被拒绝。

      其余参数都是可选的，只有传入的参数会被修改；响应在 `verification.before.lighting` 与 `verification.after.lighting` 中给出改动前后的读数，并在 `changedSettings` 中列出真正发生变化的项。

      `shadows` 开关该视图的太阳与阴影显示：关闭后 Revit 既不画太阳路径也不画投影，强度设置随之没有可见效果；Revit 没有为「图形显示选项」的「阴影」复选框提供 API，因此这是工具能写入的唯一阴影开关，而共享太阳与阴影设置的视图会被拒绝。

      `shadow_intensity` 取 0（没有投影）到 100（全黑），`sunlight_intensity` 取 0 到 100。

      `sun_date`（yyyy-MM-dd）与 `sun_time`（24 小时 HH:mm）确定「静止图像」的太阳位置，并作为本地时间交给 Revit；读数以 `sunDateAndTimeUtc` 与 `sunTimeZoneHours` 回读，因此 Revit 实际保存的时刻始终可以核对。只传其中一个时，另一半沿用视图当前值，两者都会把日照研究切回静止图像。

      需要固定太阳时改用 `sun_azimuth_deg`（自北顺时针）与 `sun_altitude_deg`（地平线以上），两者必须同时给出，会把太阳设置切到光照模式。

      `ground_plane` 开关地面平面，`ground_plane_level` 指定地面所在的标高；Revit 只接受它认定为地面平面的标高，因此传入其他标高时该标高会被标记为地面平面，响应会说明这一点。

      `background` 取 `sky` 或 `gradient`，对三维、剖切和立面视图有效；`background_colors` 依次给出渐变的天顶、地平线、地面三色（#RRGGBB），省略时沿用当前渐变，或使用浅天空到地面的默认渐变。

      `lighting_scheme` 设置渲染光源：exterior-sun、exterior-sun-and-artificial、exterior-artificial、interior-sun、interior-sun-and-artificial 或 interior-artificial。

      太阳与阴影设置属于视图；共享这些设置的视图读数为 sunSettingsShared true，改动会一并作用到共享该设置的所有视图。

      `dry_run` 会执行操作后回滚，在不改变模型的情况下返回相同的验证数据块。

      同时打开多个模型时，传入 `document` 以指定目标模型；未知或有歧义的引用会被拒绝。

      '
    source: 9ac518c62db620a6ed2f5926b3070ae2b26c6149c666df2b0bf7f9c1e7fcf63c
  revit_jobs:
    zh: '列出最近的作业，或等待最多 `wait_seconds`（0 到 50，默认 40）以获取某个操作 `jobId` 的结果。


      结果保留在工作站上 24 小时，跨服务器重启依然存在。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 09cbbc9117f148f12e9ee84948cb529497faac9d24963980589d7dd84a0ff38d
  revit_ui_state:
    zh: '读取当前文档、打开的视图、选择集以及已打开的文档。


      响应包含当前文档、打开的视图、选择集以及已打开的文档。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。

      '
    source: 6489b6c4a18cc56668e28f864cc81cf202f50aa73721544a03073b334826bdf5
  revit_capture_elements:
    zh: '渲染一张高亮的 `.png` 图像，标记 1 到 500 个构件，用作问题证据。


      支持 `3d` 或 `plan` 模式，通过本地或 SSH 传输。


      临时视图会被回滚。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 2f4491d558d795cb8a95edc2f46ebea9f60fce2be172b332a9c5cb4b54235296
  revit_activate_view:
    zh: '激活一个非模板视图。


      可以缩放到适合窗口、保持当前缩放，或框选指定的构件 ID。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: ca1bafb9b8d2e9204ef84e76546183fded619d0461270fa40202314e02e16c83
  revit_save_document:
    zh: '保存文档。


      需要先调用一次以获得 `confirm_token`，该次调用不更改任何内容。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: d47054184d65214fd65c045fc1d46659705153179acd65fbc92e22d0b203d22c
  revit_execute_code:
    zh: '在 Revit 线程上针对活动的 Revit API 编译并运行 C# 代码。


      接受一个方法体，或一个带 `Execute(ScriptContext ctx)` 的 `public static Script` 类。


      `auto` 模式独占一个事务和一个撤销条目；`transaction="none"` 默认被拒绝。


      需要先调用一次以获得 `confirm_token`，该次调用不运行任何代码；`dry_run` 不需要 `confirm_token`，并强制使用 `transaction="auto"`。


      当等待时间预算耗尽时，长操作可能返回 `status=running` 和 `jobId`；此时模型可能已经被修改，`revit_jobs` 会返回其结果。


      重新提交会重复执行该操作。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 733b52633b1dd17818fe247dcbfd947af44fe1c617cafdf396ab6d5dd71c8f68
  revit_override_graphics:
    zh: '在选定的模型视图中为构件着色；`reset` 会恢复保存在本次 Revit 会话中的覆盖设置。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: a63e16c3abdbebfe897e1503f80b29158bc986c9afa82e18bfef56be90459d48
  revit_change_type:
    zh: '将每个构件更改为一种兼容类型；`family` 可解析重复的类型名称。


      `dry_run` 会回滚。


      组成员在 `skipped.inGroup` 中报告；如果所有构件都是组成员，该调用会被拒绝。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c92792ab83663c98921356aca35eb5b662b40c31ffe60b87d18c45b42cca61cb
  revit_create_mep_run:
    zh: '根据模型中的 mm 点创建相连的风管、管道、电缆桥架或电线管段。


      缺少 Z 值时，使用该标高加上该构件种类的默认偏移量。


      无法放置的弯头以未连接配对的形式报告。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: be0eafebf6252a19037a9b0c1b4fc11543177f83cc0977f3285d1c50f9082583
  revit_duplicate_view:
    zh: '复制一个视图，可选择包含详图或创建为从属视图。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 4c6496337897a027be885fc3076ed46b692c9c36e522268f6e51835f3317fb9a
  revit_tag_elements:
    zh: '在视图中为构件添加标记，输入按类别名称或按构件 ID 选择，两者必须且只能选择其一。


      在 `createdElementIds` 中返回已创建的标记 ID；已标记的构件会被跳过，除非 `skip_tagged` 为 `false`；无法标记的输入列在 `skipped` 中。


      `tag_type` 可匹配标记类型名称、族名称或 `Family: Type`；其他情况使用默认标记类型。


      房间标记需要平面视图。


      `dry_run` 会回滚，并返回将会创建的标记。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: a37919655b3ccd01a8356874bd4541f9f6543dd9f11d1c7e15efd661e504d631
  revit_run_actions:
    zh: '执行最多 50 个动作，合并为一个撤销步骤；整个批次在首次失败时回滚。


      `dry_run` 会回滚，并返回验证块。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 77cc32d4b5e2260196949beb452c7c44ef146c555488a468d8042314dcc61ba1
  revit_batch_status:
    zh: '读取发起客户端退出之后仍然可用的运行状态和模型状态。


      这些状态是持久的，不会因为发起客户端退出而丢失。

      '
    source: d6b1eb3527eb494a54c25e901b786baccab5d7b3340156c1b248564af914b9ff
  revit_issue_register:
    zh: '写入一份新的本地 `.xlsx` 问题登记表，包含构件快照和评审文档。


      接受 1 到 60 个问题；在 210 秒预算内最多捕获 25 张快照（按严重程度选取），失败的快照会写入单元格备注。


      快照需要本地或 SSH 传输。


      已存在的输出文件会被拒绝。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: f6846d22ae596d869935ded93733a58a3576b75a3bae353ed3d658b1fee5ab5e
  revit_nwc_settings_check:
    zh: '在 Revit 工作站上解析 Navisworks 导出器的 XML 文件，不执行导出。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 1bd57b29238f61cd0ed0ecaa974662f09c61b49ce2029eb32e0ab64b38c0ad0b
  revit_view_info:
    zh: '读取一个视图的样板、显示设置、类别、工作集、过滤器和链接。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 5ed83c5c9144c8aa62ff57222d4057300d9abf27e18c42e0f1745d936a26a479
  revit_open_document:
    zh: '打开本地、UNC 或 RSN 模型；中心模型默认以分离方式打开，不支持云路径。


      长时间操作在等待预算耗尽时可能返回 `status=running` 和 `jobId`；此时模型可能已经被更改，`revit_jobs` 会返回其结果。重新提交会重复该操作。

      '
    source: 0c9ab4534ad58990c825ada09430ffddd114f560eb00ba544ea2e03c627f02c4
  revit_new_document:
    zh: '在 Revit 工作站上从样板新建项目或族，`kind` 决定新建项目还是族，`template` 指定所用的样板。

      '
    source: 943e761c62758e904654e0fb5ea34721e63b0e7c2256350c31b9a9239459610a
  revit_set_view_visibility:
    zh: '在一个视图中修改类别、工作集和过滤器的可见性；`dry_run` 只做预览。


      类别可以接受 Revit 界面名称、BuiltInCategory 名称（`OST_StructuralColumns`）、英文名称或 ID。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c21f29c8fb93322eb61568c2cfe708bdde68d4988168261d7c5b1c8ed92711cf
  revit_align_link_datums:
    zh: '将主体的轴网和标高对齐到已载入的链接，可以选择创建缺失的轴网和标高，并提供回滚预览。


      本工具不建立监视关系。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: b022226ad7fc629566d36bbac32f6029ee51c0faa268370ae4e98370bca67d3b
  revit_copy:
    zh: '沿模型坐标轴按偏移量的整数倍连续创建 1 到 100 份副本，偏移量单位为 mm；`dry_run` 会回滚。


      组成员在 `skipped.inGroup` 中报告；如果所有构件都是组成员，调用会被拒绝。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 39bfbc17e4adec81f2c0e9b9864f34f6352d9b41afdd63172dfd408e02b8888d
  revit_load_family:
    zh: '载入工作站上的 .rfa 文件，合并为一个撤销条目。


      已存在的族会被跳过，除非 `overwrite` 为真。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 93eb74f8ef7f9a927b57b7a9a3342fb714240a068014155dc9023a21ffa26a3b
  revit_walls_from_cad:
    zh: '桥接洞口、配对平行的 CAD 线并连接基本墙，合并为一个撤销条目。尺寸单位为 mm。


      Revit 拒绝的连接会被略过，并在 `unjoinedEnds` 中连同 `unjoinedReasons` 一起报告；`dry_run` 报告相同的连接数。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 0b8be48afe4f9cc38165920077e44dbf73f5fe9505466c38e55498997de0e945
  revit_create_sheet:
    zh: '创建图纸，使用第一个已载入的标题栏，或使用指定的标题栏。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 0294679b0de0b9d30144390b807a5a8fe94fd66bf95279403a02964ef886c677
  revit_export:
    zh: '在 Revit 工作站上导出 PDF、DWG、IFC 或明细表 CSV 文件；`dry_run` 返回计划生成的文件名。


      替换已有文件（`overwrite=true`）需要先调用一次取得 `confirm_token`。


      长时间操作在等待预算耗尽时可能返回 `status=running` 和 `jobId`；此时模型可能已经被更改，`revit_jobs` 会返回其结果。重新提交会重复该操作。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 6cc9e1c1b412fd73e60773186d9dfa9d50da46a7115c105814ae5aec1c102885
  revit_edit_families:
    zh: '就地编辑已打开的族，或编辑指定名称的项目族（准确名称或 `["*"]`），每个族各经历一次载入循环。


      `dry_run` 会回滚全部更改。


      长时间操作在等待预算耗尽时可能返回 `status=running` 和 `jobId`；此时模型可能已经被更改，`revit_jobs` 会返回其结果。重新提交会重复该操作。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 0587bed910fea1f1984bd0ddfe3fa58aba66246ca1af4365bc0ba4cbfa941415
  revit_batch_fetch:
    zh: '将已完成的快照下载为新的本地文件，写入 `output_dir`，不覆盖已有文件。

      '
    source: dc6879a82f743b764d27b508ae4b5c7c9fd39b9c1a4333c5be77381dc9ec2f3d
  revit_documents:
    zh: '列出一个 Revit 进程中打开的所有文档，包含后台文档。只有设置 `include_linked` 时才列出链接文档。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 291dc1dd581030aab659ff7cf3eac8783d4675f5db4a76a2ae036152f7c3aae1
  revit_schedule_data:
    zh: '读取明细表显示的表头与表体单元格文本，支持分页。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 1c21d3d0b898b2c00c17cf20211696a9483766206db25eecbc7511c1bfe38dfd
  revit_activate_document:
    zh: '按标题或路径引用激活一个已经打开的文档。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 08003b4f1ee7b7e85fdb3fcf4fc6ecf4017e28d4aaa19ae91961bdf74621de4c
  revit_close_document:
    zh: '关闭一个后台文档。


      需要先调用一次取得 `confirm_token`，首次调用不改变任何内容。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 9ace6ead5e71377b9db72cd51282f2f59a55bfbcc8f9fdc319c0905b3c81dba7
  revit_remove_links:
    zh: '删除选定的链接类型及其全部实例；`dry_run` 只做预览。该操作在 Revit 中无法撤销。


      需要先调用一次取得 `confirm_token`，首次调用不改变任何内容。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 1d9257b07911785f44b1393837f9fcb4a5c447233d509e1c44673a2eb9c3812c
  revit_cancel_job:
    zh: '请求取消某个动作的 `jobId`。


      对于 `process-models` 批处理，取消会在下一个模型开始前生效，未开始的模型被标记为已取消；单个正在运行的 Revit 操作会执行完毕，已完成的改动保持提交。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 48e4c2b729f14d491fc0bf3eee7b8705b0b19793ffd26ed1922d9e503e6511ee
  revit_mirror:
    zh: '沿穿过 `point_mm` 的模型 X 或 Y 方向平行线做镜像；`copy` 保留原构件。


      `dry_run` 会回滚。


      组成员、已固定、基于宿主和受约束的构件分别记录在 `skipped.inGroup`、`skipped.pinned`、`skipped.hosted` 和 `skipped.constrained` 中，并且不会被修改；如果所有构件都是组成员，调用会被拒绝。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: ff757969a2c5ae1b5cffb76fbc5acefbfafd0e2f32d43e256c8395938b653e02
  revit_place_families:
    zh: '载入可选族并放置实例，在同一事务和同一次撤销中完成。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: e72de7ae05fa24e1fe835910e29af5bce531d70ab27cc742d1eb9f5cbfdc5b3e
  revit_create_view:
    zh: '创建平面视图、剖面视图、三维视图或绘图视图。无边界的三维视图显示整个模型，采用着色显示和精细详细程度。


      范围框坐标使用模型 mm。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: b4f25dde4bce5d3f688943f1404b1576bec0c6a50244a05f422e6a86e356381d
  revit_place_views_on_sheet:
    zh: '把视图与明细表放到图纸上。


      坐标使用图纸 mm。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: dc874ffaf3f11903d31890fce5e136f1d351e669972378ee43d404da1fb15407
  revit_export_nwc:
    zh: '在 Revit 工作站上导出 NWC，需要安装 Navisworks 导出器。`settings_xml` 应用导出器的 XML 取值，显式传入的参数优先。


      覆盖已有文件（`overwrite=true`）需要先调用一次取得 `confirm_token`。


      耗时较长的动作在等待预算用尽时可能返回 `status=running` 和 `jobId`；此时模型可能已经被修改，`revit_jobs` 会返回它的结果。重新提交会重复该动作。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: cb16d479dc3cca7fc247a51f2d9c2f090a88e327a76fb88dd9f2673ffc04b9af
  revit_batch_start:
    zh: '对本地、UNC 或 RSN 模型启动一次持久化的只读运行。


      `open_timeout_minutes` 是每个模型的打开时限（默认 30，在内存中升级时为 45）。

      '
    source: 8475b4dbfe17061ee7bbe2920d9740e9016a5d0bb1453edfe954b310a8f6374f
  revit_build_report:
    zh: '不连接 Revit，直接从快照文件读取数据，在本地生成 Excel 报告，不需要 Revit 在运行。

      '
    source: 711824cc9bc38f51d3453e0bcc1e28efe4ab682b65834df551c97739f57421c8
  revit_compare_link_datums:
    zh: '将主模型的轴网和标高与一个已加载的 Revit 链接进行比较。


      返回轴网和标高的对比结果；不改变任何内容。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 8bf597c28707a89dcf22b3555e89e66fe8b8a1952edfb48d03be732d7725d284
  revit_model_snapshot:
    zh: '读取用于批量审计的模式版本 1 项目快照。


      返回项目的快照数据。


      关闭的工作集可能使结果不完整。

      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 02c7dccd661f9118da40e914b7366739ac57064d4ae78bccf0d6ed919cedea4f
  revit_family_audit:
    zh: '审计一个已打开的族或指定名称的项目族，不保存也不加载任何更改。


      项目模式接受精确的族名称或 `["*"]`；族模式不接受名称。

      `detail="summary"` 返回参数计数和最多 20 个未使用的参数名称；`detail="full"` 返回全部参数元数据，包含组 ID 和 `groupName` 标签。

      通配符按名称排序，审计前 200 个可编辑族；其余每个名称及原因记录在 `data.skipped` 中，并附 `skippedCount`。


      非空 `skipped` 列表表示结果不完整；`skippedCount` 统计所有被跳过的条目。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: ec3fd8a76022a9f56915b4995e0a20cb9c599a6039d9ee785233c8faef8f8d4f
  revit_close_views:
    zh: '关闭活动文档中已打开的 UI 视图。


      `views` 指定要关闭的视图；省略时关闭除活动视图外的所有打开视图，`keep_active` 为真时保留活动视图。

      无法关闭的视图会被拒绝，并在结果中报告原因。

      '
    source: ad6c93cd17f90a28b36efa2cfe192d34c64f8228c2b124238cf0e8fe63921344
  revit_sync_document:
    zh: '将工作共享文档与中心模型同步。


      需要先调用一次以获得 `confirm_token`，该次调用不改变任何内容。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: 1b046e57fc303761f78e1ffb779692ef50c7b6de4dfc33f3678ba2cf7404ec07
  revit_undo_last:
    zh: '通过 Revit 自带的撤销命令撤销上一步 MCP 操作。


      只有在目标文档处于活动状态、没有待处理命令，且 Revit 最后一条撤销记录正是本会话记录的那一条时才会执行；否则结果中会给出拒绝原因。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: bfbbbf84839bfbe862e8683d9f62409fa0eb36a198bbbac3a1b5ce6019ce86b6
  revit_rotate:
    zh: '绕穿过 `center_mm` 的竖直轴旋转构件，或绕它们组合后的包围盒中心旋转。


      `dry_run` 会回滚。

      组成员、已固定、基于宿主和受约束的构件分别记录在 `skipped.inGroup`、`skipped.pinned`、`skipped.hosted` 和 `skipped.constrained` 中，并且不会被修改；如果所有构件都是组成员，调用会被拒绝。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: f6103af886012373cacdf2f671041556bb75e070611ed0a87d1a1d712831843f
  revit_update_parameters:
    zh: '更新与 `revit_query_elements` 相同筛选条件匹配的构件上的一个参数。


      组成员在 `skipped.inGroup` 中报告，而不是让整个调用失败；`dry_run` 会预先给出这一结果。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: bcb4253ab4ea0513d16b4fbe9e9be63a2bdec446428b4fbd62986c439a857268
  revit_link_cad:
    zh: '在 Revit 工作站上将 DWG 链接或导入到平面视图中。


      返回 CAD 图层和范围，单位为 mm。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: c1850f047c2e25be5d9fc49bb4352c70bbb9af06971d2a2d240fc837954412b4
  revit_apply_view_template:
    zh: '将匹配的视图样板应用到一个或多个视图。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: d270c76dbb4d83aa166f4fac45e4f789ad7379471fd477c26366eb89bcaddab0
  revit_create_schedule:
    zh: '为单个类别按给定顺序和命名字段创建明细表，字段使用 Revit 界面名称，例如 `Mark`、`Level` 或 `Count`。


      `filters` 按字段、运算符和值保留行；`sort` 排序，并在设置 `header` 或 `footer` 时对行分组。

      长度单位为 mm，面积单位为 m2，体积单位为 m3。

      `itemized=false` 会合并完全相同的行。


      返回 `viewId` 和解析后的字段；无法识别的名称列在 `skipped` 中。

      `dry_run` 会回滚。


      如果有多个 Revit 实例正在运行，必须提供 `document`；否则任意实例都可能响应。

      '
    source: d03667198453bb7c56e82eadc1db6843c5e008946a49287df088dd999299b0e0
  revit_process_models:
    zh: '在交互会话中逐个打开模型，执行步骤和 C# 代码，按需导出、另存并关闭。


      原地保存和执行代码需要预览响应中的 `confirm_token`。

      `dry_run` 会强制 `code.transaction="auto"`，并在 `warnings` 中报告这一覆盖。


      当等待预算耗尽时，长时间操作可能返回 `status=running` 和 `jobId`；此时模型可能已经被修改，`revit_jobs` 会返回其结果。重新提交会重复该操作。

      '
    source: 0ec456b819f9a70e2634c101ffbce9438924dc5f819c3a1a7ea30ff9b2442a94
  revit_batch_cancel:
    zh: '持久化取消请求，阻止尚未启动的模型继续运行。


      取消状态保存在该次运行中，发起客户端退出后依然有效；已经开始执行的模型会继续执行完毕。

      返回该次运行的当前状态。

      '
    source: c32c2aa46639d7c3d8fdaf863723a3d43e51a1ff796808ee5dbe527f167fe8df
