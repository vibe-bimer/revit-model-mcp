site_name: Revit Model MCP
site_description: "把 Autodesk Revit 模型接到 AI 助手：查询参数与几何、统计构件、检查模型、导出清单并编辑构件，默认只读。"
copyright: Autodesk and Revit are registered trademarks or trademarks of Autodesk, Inc., and/or its subsidiaries and/or affiliates in the USA and/or other countries. Model MCP is an independent project and is not affiliated with or endorsed by Autodesk.
site_url: https://vibe-bimer.github.io/revit-model-mcp/
repo_url: https://github.com/vibe-bimer/revit-model-mcp
repo_name: vibe-bimer/revit-model-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-white.svg
  favicon: assets/favicon.svg
  # The three faces are self-hosted from assets/fonts, so the site renders identically on a network
  # without Google Fonts and never sends a request to a third party.
  font: false
  palette:
    # `media` makes the first visit follow the operating system instead of always starting light; the
    # toggle keeps working and the choice is remembered per page path.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色
  features:
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - header.autohide
    # search.suggest keeps header suggestions. The 0.9 MB search index is fetched either way, and it
    # is requested after `load`, so it costs bandwidth rather than first paint.
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css
  - stylesheets/landing.css
extra_javascript:
  - javascripts/search-catalog.js
  - javascripts/search-enhance.js
  - javascripts/site.js
hooks:
  - docs/hooks.py
watch:
  - tools/site/content
  - server/pyproject.toml
  - server/README.md
  - server/README.zh.md
  - CONTRIBUTING.md
  - CONTRIBUTING.zh.md
  - CHANGELOG.md
  - CHANGELOG.zh.md
  - SECURITY.md
  - SECURITY.zh.md
exclude_docs: |
  requirements.txt
  requirements.in
  hooks.py
  __pycache__/
  # The demo recording and the social card template live outside docs/ now, so nothing has to be
  # excluded here. tools/site/check_site.py still fails the build if any unreferenced asset
  # reaches the tree.

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # English is the language of every inherited upstream page; until a zh translation
      # exists, the /en/ build serves the same (English) file instead of dropping the page
      # from the English navigation. See ADR-0007 for the declared-coverage policy.
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: "Bring Autodesk Revit models to your AI assistant: inspect parameters and geometry, count elements, check models, export registers and edit elements. Read-only by default."
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                toggle:
                  icon: material/brightness-4
                  name: Switch to light
          nav_translations:
            首页: Home
            功能: Features
            按 Revit 年份: By Revit year
            读取功能: Read features
            动作功能: Action features
            连接与文档: Connection and documents
            查询与统计: Query and totals
            视图与截图: Views and snapshots
            导出与检验: Export and checks
            选中与显示: Selection and display
            编辑: Editing
            阶段: Phases
            批量与 ID: Batch and IDs
            新版基座: New platform
            自研工具的移植状态: Fork tool migration status
            连接与实例: Connection and instances
            编辑原语: Editing primitives
            文档生命周期: Document lifecycle
            视图、图纸与明细表: Views, sheets and schedules
            视图: Views
