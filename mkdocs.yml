site_name: Revit Model MCP
site_url: https://sharafutdinovdi.github.io/revit-model-mcp/
repo_url: https://github.com/sharafutdinovdi/revit-model-mcp
repo_name: sharafutdinovdi/revit-model-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-white.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色 / Switch to dark
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色 / Switch to light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css
hooks:
  - docs/hooks.py
watch:
  - README.md
  - server/README.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - SECURITY.md
exclude_docs: |
  requirements.txt
  hooks.py
  __pycache__/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            指南: Guide
            服务器: Server
            工作原理: How it works
            传输与接入: Transport
            安全: Security
            架构: Architecture
            参考: Reference
            读取工具: Read tools
            动作工具: Action tools
            实测证据: Validation
            文件通道格式: Feed format
            路线图: Roadmap
            项目: Project
            隐私: Privacy
            贡献: Contributing
            变更日志: Changelog
            安全政策: Security policy
            功能: Features
            按版本: By version
            工具手册: Tools
            提示词库: Prompts

nav:
  # >>> features-nav
  - 功能:
      - features/index.md
      - 按版本:
          - features/v2020.md
          - features/v2026.md
          - features/matrix.md
      - 工具手册:
          - 连接与文档:
              - revit_ping: features/revit_ping.md
              - revit_document_info: features/revit_document_info.md
              - revit_list_instances: features/revit_list_instances.md
          - 查询与统计:
              - revit_list_catalog: features/revit_list_catalog.md
              - revit_aggregate_elements: features/revit_aggregate_elements.md
              - revit_query_elements: features/revit_query_elements.md
              - revit_element_details: features/revit_element_details.md
              - revit_list_relations: features/revit_list_relations.md
          - 视图与截图:
              - revit_list_views: features/revit_list_views.md
              - revit_view_summary: features/revit_view_summary.md
              - revit_export_view: features/revit_export_view.md
              - revit_view_elements: features/revit_view_elements.md
              - revit_view_warnings: features/revit_view_warnings.md
          - 导出与检验:
              - revit_model_health: features/revit_model_health.md
              - revit_links_status: features/revit_links_status.md
              - revit_shared_coordinates: features/revit_shared_coordinates.md
              - revit_parameter_fill_check: features/revit_parameter_fill_check.md
              - revit_export_element_ids: features/revit_export_element_ids.md
              - revit_list_warnings: features/revit_list_warnings.md
          - 选中与显示:
              - revit_select: features/revit_select.md
              - revit_show: features/revit_show.md
              - revit_isolate: features/revit_isolate.md
          - 编辑:
              - revit_move: features/revit_move.md
              - revit_place_family: features/revit_place_family.md
              - revit_create_wall: features/revit_create_wall.md
              - revit_create_floor: features/revit_create_floor.md
              - revit_set_parameter: features/revit_set_parameter.md
              - revit_delete: features/revit_delete.md
          - 阶段:
              - revit_set_phase: features/revit_set_phase.md
              - revit_merge_phases: features/revit_merge_phases.md
          - 批量与 ID:
              - revit_reset_element_ids: features/revit_reset_element_ids.md
              - revit_rebuild_model_ids: features/revit_rebuild_model_ids.md
              - revit_batch: features/revit_batch.md
      - features/prompts.md
  # <<< features-nav
  - 首页: index.md
  - 指南:
      - 服务器: server.md
      - 工作原理: how-it-works.md
      - 传输与接入: transport.md
      - 安全: security.md
      - 架构: architecture.md
  - 参考:
      - 读取工具: tools.md
      - 动作工具: actions.md
      - 实测证据: validation.md
      - 文件通道格式: feed-format.md
      - 路线图: roadmap.md
  - 项目:
      - 隐私: privacy.md
      - 贡献: contributing.md
      - 变更日志: changelog.md
      - 安全政策: security-policy.md
