site_name: Revit Model MCP (vibe-bimer)
copyright: Autodesk and Revit are registered trademarks or trademarks of Autodesk, Inc., and/or its subsidiaries and/or affiliates in the USA and/or other countries. Model MCP is an independent project and is not affiliated with or endorsed by Autodesk.
site_url: https://vibe-bimer.github.io/revit-model-mcp/
repo_url: https://github.com/vibe-bimer/revit-model-mcp
repo_name: vibe-bimer/revit-model-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-white.svg
  favicon: assets/favicon.svg
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css
hooks:
  - docs/hooks.py
watch:
  - README.md
  - server/README.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - SECURITY.md
exclude_docs: |
  requirements.txt
  requirements.in
  hooks.py
  __pycache__/
  # The agent guidance is bilingual and lives in the repository, not on the site.
  agents/

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - install.md
          - server.md
          - contributing.md
        Concepts:
          - how-it-works.md
          - transport.md
          - batch.md
          - security.md
          - architecture.md
          - updates.md
          - admin/deployment.md
          - admin/policy-reference.md
          - admin/security-whitepaper.md
          - admin/security-questionnaire.md
          - design/model-audit.md
        Reference:
          - tools.md
          - stability.md
          - prompts.md
          - actions.md
          - validation.md
          - feed-format.md
          - mcp-specifications.md
          - tested-clients.md
          - not-doing.md
          - roadmap.md
          - changelog.md
          - security-policy.md

nav:
